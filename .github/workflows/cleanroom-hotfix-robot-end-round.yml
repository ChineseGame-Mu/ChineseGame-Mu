name: Cleanroom robot end-round hotfix

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - .github/workflows/cleanroom-hotfix-robot-end-round.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Patch robot continuation after collecting a trick
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()
          old = '''            GuandanClientMessage::EndRound => {
                let key = match joined_room.clone() {
                    Some(key) => key,
                    None => continue,
                };
                let result = storage
'''
          new = '''            GuandanClientMessage::EndRound => {
                let key = match joined_room.clone() {
                    Some(key) => key,
                    None => continue,
                };
                let hook_to_bottom = hook_to_bottom_for(&key);
                let result = storage
'''
          if old not in s:
              raise SystemExit('EndRound anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''                        state.game.passes = 0;
                        state.game.trick_complete = false;
                        state.bump_version();
'''
          new2 = '''                        state.game.passes = 0;
                        state.game.trick_complete = false;
                        // If collecting the trick hands the lead to a robot, let it
                        // act immediately instead of leaving the table stuck on an
                        // empty trick with a robot shown as the current player.
                        run_robot_turns(&mut state.game, hook_to_bottom).map_err(|_| ())?;
                        state.bump_version();
'''
          marker = s.find('GuandanClientMessage::EndRound =>')
          tail = s[marker:]
          if old2 not in tail:
              raise SystemExit('EndRound state-reset anchor not found')
          tail = tail.replace(old2, new2, 1)
          s = s[:marker] + tail
          p.write_text(s)
      - name: Verify patch
        run: |
          grep -A35 'GuandanClientMessage::EndRound' backend/src/guandan_handler.rs | grep 'run_robot_turns'
          cargo check -p backend
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/guandan_handler.rs
          git commit -m 'fix: continue robot play after trick collection'
          git push origin HEAD:cleanroom/yihua-game-20260826
