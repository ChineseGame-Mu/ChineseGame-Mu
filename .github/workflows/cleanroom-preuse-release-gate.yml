name: Cleanroom Mandatory Pre-Use Release Gate

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
  workflow_dispatch:

jobs:
  preuse-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STALE_MANUAL_URL: https://yihua-2ah5da0zg-chinese-game.vercel.app
      STALE_MANUAL_SHA: 71c58ed698d5bde1c56c907b8df468f65e8560ea
      LIVE_BRANCH_URL: https://yihua-mu-git-cleanroom-yihua-game-20260826-chinese-game.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Mandatory current-commit freshness policy
        shell: bash
        run: |
          set -euo pipefail
          echo "Current GitHub SHA: $GITHUB_SHA"
          if [ "$GITHUB_SHA" = "$STALE_MANUAL_SHA" ]; then
            echo "::error::Current SHA is the known stale manual deployment SHA."
            exit 1
          fi
          echo "::notice::The old immutable manual URL $STALE_MANUAL_URL is forbidden for release/use after newer commits."
          echo "::notice::A manual immutable Vercel URL may be released only after its Vercel githubCommitSha is verified equal to this exact GITHUB_SHA."

      - name: Mandatory lobby hero no-overlap contract
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=frontend/src/CleanroomEntry.tsx
          CSS=frontend/src/cleanroom-lobby-polish.css
          test -f "$ENTRY"
          test -f "$CSS"
          grep -F 'import "./cleanroom-lobby-polish.css";' "$ENTRY"
          grep -F '<div className="cleanroom-emblem-title">掼蛋</div>' "$ENTRY"
          grep -F '<h1 className="cleanroom-game-title">掼蛋游戏</h1>' "$ENTRY"
          grep -F '.cleanroom-brand {' "$CSS"
          grep -F 'flex-direction: column;' "$CSS"
          grep -F '.cleanroom-emblem {' "$CSS"
          grep -F 'margin: 0 auto 12px;' "$CSS"
          grep -F '.cleanroom-game-title {' "$CSS"
          grep -F 'margin: 0 !important;' "$CSS"
          if grep -E '\.cleanroom-game-title[^}]*margin[^;]*-' "$CSS"; then
            echo "::error::Lobby title may not use a negative margin that can overlap the emblem."
            exit 1
          fi
          echo "::notice::Lobby QA requires the 掼蛋 emblem and 掼蛋游戏 heading to remain separate, stacked blocks with positive spacing."

      - name: Mandatory fixed-room source contract and deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=frontend/src/CleanroomEntry.tsx
          WS=frontend/src/GuandanWebsocketProvider.tsx
          test -f "$ENTRY"
          test -f "$WS"
          grep -F 'const selectableRooms = ["0001", "0002", "0003", "0004"] as const;' "$ENTRY"
          grep -F '<select' "$ENTRY"
          grep -F 'id="cleanroom-room"' "$ENTRY"
          if grep -E 'input[^>]+(name="room"|name="cleanroomRoom"|id="cleanroom-room")' "$ENTRY"; then
            echo "::error::Free-text fixed-room input is forbidden."
            exit 1
          fi
          grep -F 'cleanroomDeploymentRoom' "$WS"
          grep -F 'return `cr-${deploymentKey}-${room}`;' "$WS"
          echo "::notice::0001-0004 remain deployment-scoped; a new immutable deployment uses a different backend room namespace from the stale deployment."

      - name: Mandatory single visible public room-number contract
        shell: bash
        run: |
          set -euo pipefail
          HEADER=frontend/src/GuandanHeaderDecor.tsx
          CSS=frontend/src/cleanroom-device-layout.css
          TABLE=frontend/src/GuandanTable.tsx
          test -f "$HEADER"
          test -f "$CSS"
          test -f "$TABLE"
          grep -F 'const room = query.get("cleanroomRoom") ?? query.get("room") ?? "";' "$HEADER"
          grep -F 'return /^000[1-4]$/.test(room) ? room : "";' "$HEADER"
          grep -F 'className="guandan-header-visible-room"' "$HEADER"
          grep -F '房间：{visibleRoom}' "$HEADER"
          grep -F '#root .guandan-table > .guandan-status-bar > div:nth-child(3),' "$CSS"
          grep -F '#root .guandan-table > .guandan-status-bar > div:nth-of-type(2) {' "$CSS"
          grep -F 'display: none !important;' "$CSS"
          grep -F 'visibility: hidden !important;' "$CSS"
          grep -F 'opacity: 0 !important;' "$CSS"
          grep -F '.guandan-header-visible-room {' "$CSS"
          grep -F '{state.room !== null && <div>房间：{state.room}</div>}' "$TABLE"
          public_label_count=$(grep -F -c '房间：{visibleRoom}' "$HEADER")
          if [ "$public_label_count" -ne 1 ]; then
            echo "::error::Exactly one public room label renderer is required; found $public_label_count."
            exit 1
          fi
          if grep -F '房间：{state.room}' "$HEADER"; then
            echo "::error::Public decorative header must never display the internal commit-scoped room id."
            exit 1
          fi
          if grep -E 'guandan-header-visible-room[^\n]*cr-' "$HEADER"; then
            echo "::error::Public room label must never expose a cr- deployment namespace."
            exit 1
          fi
          echo "::notice::Exactly one player-visible room label is permitted: 房间：0001-0004. The internal cr-<commit>-000N node must remain invisible."

      - name: Mandatory no-old-room-data QA policy
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/cleanroom-live-ui-e2e-gate.yml
          test -f "$WF"
          grep -F 'fixedRoomJoinPerformed:false' "$WF"
          grep -F 'fixedRoomsTouched:false' "$WF"
          grep -F 'const room = `ui-e2e-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;' "$WF"
          if grep -F "send({type:'join',room:'0001'" "$WF"; then
            echo "::error::QA must never join fixed public room 0001."
            exit 1
          fi
          echo "::notice::QA is forbidden from joining 0001-0004; gameplay E2E uses a unique disposable room so QA cannot leave old players, old hands or old match state in public rooms."

      - name: Mandatory live branch smoke before release
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' "$LIVE_BRANCH_URL" || true)
            if [ "$code" = "200" ] && [ "$(wc -c </tmp/live.html)" -gt 500 ]; then
              echo "Live branch frontend reachable: HTTP $code"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Latest branch frontend did not become healthy before release gate timeout."
          exit 1
