name: Cleanroom Mandatory Pre-Use Release Gate

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
  workflow_dispatch:

jobs:
  preuse-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STALE_MANUAL_URL: https://yihua-2ah5da0zg-chinese-game.vercel.app
      STALE_MANUAL_SHA: 71c58ed698d5bde1c56c907b8df468f65e8560ea
      LIVE_BRANCH_URL: https://yihua-mu-git-cleanroom-yihua-game-20260826-chinese-game.vercel.app
      RELEASE_URL: https://yihua-mu.vercel.app/
    steps:
      - uses: actions/checkout@v4

      - name: Mandatory current-commit freshness policy
        shell: bash
        run: |
          set -euo pipefail
          echo "Current GitHub SHA: $GITHUB_SHA"
          if [ "$GITHUB_SHA" = "$STALE_MANUAL_SHA" ]; then
            echo "::error::Current SHA is the known stale manual deployment SHA."
            exit 1
          fi
          echo "::notice::The old immutable manual URL $STALE_MANUAL_URL is forbidden for release/use after newer commits."

      - name: Mandatory approved final-art lobby integration contract
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=frontend/src/CleanroomEntry.tsx
          ART=frontend/src/cleanroom-lobby-artwork.css
          IMAGE=frontend/src/cleanroom-lobby-final-image.ts
          VISUAL=.github/workflows/cleanroom-lobby-visual-gate.yml
          test -f "$ENTRY"
          test -f "$ART"
          test -f "$IMAGE"
          test -f "$VISUAL"
          grep -F 'className="cleanroom-final-shell"' "$ENTRY"
          grep -F 'className="cleanroom-final-stage"' "$ENTRY"
          grep -F 'className="cleanroom-final-art"' "$ENTRY"
          grep -F 'id="cleanroom-room"' "$ENTRY"
          grep -F 'id="cleanroom-player-count"' "$ENTRY"
          grep -F 'id="cleanroom-player-name"' "$ENTRY"
          grep -F 'id="cleanroom-enter-room"' "$ENTRY"
          grep -F 'data:image/webp;base64,' "$IMAGE"
          grep -F '.cleanroom-final-stage {' "$ART"
          grep -F '.cleanroom-final-control {' "$ART"
          grep -F '.cleanroom-final-enter {' "$ART"
          grep -F "viewport: { width: 390, height: 844 }" "$VISUAL"
          grep -F "approved artwork data URI missing" "$VISUAL"
          grep -F "live controls overlap or are out of order" "$VISUAL"
          grep -F 'RELEASE_URL: https://yihua-mu.vercel.app/' .github/workflows/cleanroom-preuse-release-gate.yml
          echo "::notice::Final artwork lobby and iPhone visual geometry QA contract are installed."

      - name: Mandatory fixed-room source contract and deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=frontend/src/CleanroomEntry.tsx
          WS=frontend/src/GuandanWebsocketProvider.tsx
          test -f "$ENTRY"
          test -f "$WS"
          grep -F 'const selectableRooms = ["0001", "0002", "0003", "0004"] as const;' "$ENTRY"
          grep -F 'id="cleanroom-room"' "$ENTRY"
          if grep -E 'input[^>]+(name="room"|name="cleanroomRoom"|id="cleanroom-room")' "$ENTRY"; then
            echo "::error::Free-text fixed-room input is forbidden."
            exit 1
          fi
          grep -F 'cleanroomDeploymentRoom' "$WS"
          grep -F 'return `cr-${deploymentKey}-${room}`;' "$WS"

      - name: Mandatory single visible public room-number contract
        shell: bash
        run: |
          set -euo pipefail
          HEADER=frontend/src/GuandanHeaderDecor.tsx
          CSS=frontend/src/cleanroom-device-layout.css
          TABLE=frontend/src/GuandanTable.tsx
          grep -F 'className="guandan-header-visible-room"' "$HEADER"
          grep -F '房间：{visibleRoom}' "$HEADER"
          grep -F 'display: none !important;' "$CSS"
          grep -F 'visibility: hidden !important;' "$CSS"
          grep -F 'opacity: 0 !important;' "$CSS"
          grep -F '{state.room !== null && <div>房间：{state.room}</div>}' "$TABLE"
          public_label_count=$(grep -F -c '房间：{visibleRoom}' "$HEADER")
          test "$public_label_count" -eq 1

      - name: Mandatory no-old-room-data QA policy
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/cleanroom-live-ui-e2e-gate.yml
          grep -F 'fixedRoomJoinPerformed:false' "$WF"
          grep -F 'fixedRoomsTouched:false' "$WF"
          grep -F 'const room = `ui-e2e-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;' "$WF"

      - name: Mandatory first-play Start gate and initial-draw lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ENTRY=frontend/src/CleanroomEntry.tsx
          GATE=frontend/src/GuandanStartGate.tsx
          TEST=frontend/src/guandanInitialDrawLifecycle.test.ts
          test -f "$ENTRY"
          test -f "$GATE"
          test -f "$TEST"
          grep -F 'import GuandanStartGate from "./GuandanStartGate";' "$ENTRY"
          mount_count=$(grep -oF '<GuandanStartGate />' "$ENTRY" | wc -l | tr -d ' ')
          test "$mount_count" -eq 1
          grep -F 'let activeStartGateOwner: symbol | null = null;' "$GATE"
          grep -F 'data-start-gate-singleton="true"' "$GATE"
          grep -F 'const serverPlayStarted =' "$GATE"
          grep -F 'state.lastPlay.length > 0 || state.tablePlays.length > 0;' "$GATE"
          if grep -F 'state.turn !== null || state.lastPlay.length > 0 || state.tablePlays.length > 0;' "$GATE"; then
            echo "::error::Pre-start turn assignment must not suppress the Start button."
            exit 1
          fi
          grep -F 'nextInitialDrawHidden' "$GATE"
          grep -F 'does not reappear when lastPlay and tablePlays clear between tricks' "$TEST"
          grep -F 'only a genuinely new full deal resets the per-hand hide latch' "$TEST"
          grep -F 'aria-label="开始本局出牌"' "$GATE"
          echo "::notice::Exactly one Start gate is mounted; initial draw must stay hidden for the whole hand once Start/real play occurs, including after trick collection."

      - name: Mandatory public player-count rendering contract
        shell: bash
        run: |
          set -euo pipefail
          TABLE=frontend/src/GuandanTable.tsx
          grep -F 'const supportedPlayerCounts = [4, 6, 8, 10, 12, 14] as const;' "$TABLE"
          grep -F 'const effectiveTableSize =' "$TABLE"
          grep -F 'state.players.map((player, index) =>' "$TABLE"
          echo "::notice::Public backs remain bound to actual joined players; selected table size must be preserved in the URL and backend state."

      - name: Mandatory complete current-trick public history contract
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER=frontend/src/guandanCompatibilityAdapter.ts
          TABLE=frontend/src/GuandanTable.tsx
          TEST=frontend/src/guandanCurrentTrickPlays.test.ts
          test -f "$ADAPTER"
          test -f "$TABLE"
          test -f "$TEST"
          grep -F 'export const mergeCurrentTrickPlays =' "$ADAPTER"
          grep -F 'tablePlays: currentTrickPlays,' "$ADAPTER"
          grep -F 'state.tablePlays.map((play, playIndex) =>' "$TABLE"
          grep -F 'keeps every distinct play when server snapshots contain only the newest play' "$TEST"
          grep -F 'clears old cards only when the completed trick has been collected' "$TEST"
          echo "::notice::Public table must retain every played card/play for the current trick until collection, then clear for the next trick."

      - name: Mandatory 借东风 authoritative turn-rule contract
        shell: bash
        run: |
          set -euo pipefail
          PATCH=backend/build.rs
          HANDLER=backend/src/guandan_handler.rs
          test -f "$PATCH"
          test -f "$HANDLER"
          grep -F 'fn assign_next_trick_leader(game: &mut GuandanGameState, winner: usize)' "$PATCH"
          grep -F 'let partner = (winner + 2) % GUANDAN_CLASSIC_PLAYER_COUNT;' "$PATCH"
          grep -F 'assign_next_trick_leader(&mut state.game, winner);' "$PATCH"
          grep -F 'borrow_east_wind_finished_x2_gives_next_lead_to_x4' "$PATCH"
          echo "::notice::A finished four-player trick winner must transfer the next lead to the opposite-seat partner (借东风), never to an opponent by seat-order fallback."

      - name: Mandatory 借东风 backend behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p shengji borrow_east_wind_finished_x2_gives_next_lead_to_x4 -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Mandatory install with locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Mandatory initial-draw whole-hand regression test
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn test guandanInitialDrawLifecycle.test.ts --runInBand

      - name: Mandatory behavioral current-trick accumulation test
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn test guandanCurrentTrickPlays.test.ts --runInBand

      - name: Mandatory full frontend regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn test --runInBand

      - name: Mandatory frontend lint error check
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn lint

      - name: Mandatory production build and TypeScript compile check
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn build

      - name: Mandatory live branch smoke before release
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' "$LIVE_BRANCH_URL" || true)
            if [ "$code" = "200" ] && [ "$(wc -c </tmp/live.html)" -gt 500 ]; then
              echo "Live branch frontend reachable: HTTP $code"
              break
            fi
            if [ "$i" = 6 ]; then
              echo "::error::Latest branch frontend did not become healthy before release gate timeout."
              exit 1
            fi
            sleep 10
          done

      - name: Mandatory public short-link freshness before sharing
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking release URL: $RELEASE_URL"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/release.html -w '%{http_code}' "$RELEASE_URL" || true)
            if [ "$code" = "200" ] && [ "$(wc -c </tmp/release.html)" -gt 500 ]; then
              actual=$(grep -oE 'data-cleanroom-commit="[0-9a-f]{40}"' /tmp/release.html | head -1 | sed -E 's/.*="([0-9a-f]{40})"/\1/' || true)
              if [ -n "$actual" ] && [ "$actual" = "$GITHUB_SHA" ]; then
                echo "Public short link is healthy and current: $actual"
                ok=1
                break
              fi
              echo "Attempt $i: short link HTTP $code but commit is '${actual:-missing}', expected '$GITHUB_SHA'"
            else
              echo "Attempt $i: short link not healthy yet, HTTP $code"
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Do not share $RELEASE_URL: it is not serving the current commit $GITHUB_SHA."
            exit 1
          fi
          echo "::notice::The public URL may only be given to the user after this gate and the required visual/E2E gates pass."
