name: Patch cleanroom one-start-per-game gate

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
          fetch-depth: 0
      - name: Patch backend game-start gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('yihua-game/src/core/legacy-guandan-gateway.ts')
          s = p.read_text()
          replacements = [
            ('const startedLegacyTricks = new Map<string, number>();', 'const startedLegacyGames = new Set<string>();'),
            ('  managed.game.phase === "playing" &&\n  startedLegacyTricks.get(roomId) === managed.game.trick.completedTricks;', '  managed.game.phase === "playing" && startedLegacyGames.has(roomId);'),
            ('    if (managed.game.phase !== "playing" || !legacyTrickStarted(roomId, managed)) {\n      return;\n    }', '    if (\n      managed.game.phase !== "playing" ||\n      !legacyTrickStarted(roomId, managed) ||\n      pendingLegacyTricks.has(roomId)\n    ) {\n      return;\n    }'),
            ('        startedLegacyTricks.set(\n          active.roomId,\n          managed.game.trick.completedTricks,\n        );', '        startedLegacyGames.add(active.roomId);'),
            ('        await runtime.websocket.broadcastGameState(\n          runtime.rooms.get(active.roomId),\n        );\n        return;', '        await runtime.websocket.broadcastGameState(\n          runtime.rooms.get(active.roomId),\n        );\n        await runLegacyRobots(runtime, active.roomId);\n        return;'),
            ('        startedLegacyTricks.delete(active.roomId);', '        startedLegacyGames.delete(active.roomId);'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'expected backend pattern not found: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit backend fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yihua-game/src/core/legacy-guandan-gateway.ts
          git commit -m 'fix(cleanroom): keep start gate open for whole game'
          git push origin HEAD:cleanroom/yihua-game-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backend
        continue-on-error: true
        working-directory: yihua-game
        run: |
          npm ci
          npm run typecheck
          npm test
