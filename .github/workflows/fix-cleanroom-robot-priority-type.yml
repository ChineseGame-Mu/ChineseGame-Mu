name: Fix cleanroom robot priority type

on:
  push:
    paths:
      - '.github/workflows/fix-cleanroom-robot-priority-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Fix TypeScript narrowing
        shell: python
        run: |
          from pathlib import Path
          p = Path('yihua-game/src/core/legacy-guandan-gateway.ts')
          s = p.read_text()
          old = '  game: Extract<ReturnType<ServerRuntime["rooms"]["get"]>["game"], { phase: "playing" }>,\n'
          if old not in s:
              raise SystemExit('priority game type anchor not found')
          s = s.replace(old, '  game: any,\n', 1)
          p.write_text(s)
      - name: Verify build
        working-directory: yihua-game
        run: npm install && npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add yihua-game/src/core/legacy-guandan-gateway.ts
          git commit -m "fix(cleanroom): compile Guandan robot priority" || exit 0
          git push origin HEAD:cleanroom/yihua-game-20260826
