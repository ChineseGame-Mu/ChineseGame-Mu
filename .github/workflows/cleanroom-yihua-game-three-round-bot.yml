name: Yihua Game Association-Standard Full-Rules Team Strategy QA

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/cleanroom-yihua-game-three-round-bot.yml"
      - "yihua-game/QA_GUANDAN_FULL_RULES_TEAM_STRATEGY.md"
      - "yihua-game/QA_GUANDAN_ASSOCIATION_COMPLIANCE.md"
      - "yihua-game/scripts/**"
      - "yihua-game/src/core/**"
      - "yihua-game/test/**"
      - "backend/src/guandan_handler.rs"
      - "frontend/src/GuandanRoundResultHud.tsx"
      - "frontend/src/GuandanRoundResultHud.test.tsx"
      - "frontend/src/CleanroomEntry.tsx"
  workflow_dispatch:

jobs:
  association-standard-full-rules-team-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yihua-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build standalone server
        run: npm run build

      - name: State-machine acceptance - final player auto-place through next round
        run: npm test -- last-place-auto-finish-next-round-matrix.test.ts

      - name: Association-standard four-player full-rules expert-strategy tournament
        env:
          QA_STANDARD: "guandan-association-full-rules-team-strategy-v3"
          QA_RULE_PROFILE: "national-competitive"
          SOAK_DURATION_MS: "900000"
          SOAK_PLAYER_COUNTS: "4"
          SOAK_RECONNECT_EVERY: "1000000"
          SOAK_ACTION_LIMIT: "1000000"
          QA_START_LEVEL: "2"
          QA_REQUIRE_PASS_A: "1"
          QA_REQUIRE_TEAM_STRATEGY: "1"
          QA_REQUIRE_FULL_RULE_COVERAGE: "1"
          QA_REQUIRE_HEART_LEVEL_WILDCARD: "1"
          QA_REQUIRE_TRIBUTE_RULES: "1"
          QA_REQUIRE_CARD_CONSERVATION: "1"
          QA_REQUIRE_HIDDEN_INFO_ISOLATION: "1"
          QA_REQUIRE_ILLEGAL_SIGNALLING_PROTECTION: "1"
          QA_REQUIRE_EXPERT_TACTICS: "1"
          QA_REPORT_JSON: "/tmp/guandan-team-strategy-report.json"
          QA_REPORT_MD: "/tmp/guandan-team-strategy-report.md"
        run: |
          set -euo pipefail
          node scripts/soak-websocket.mjs | tee /tmp/full-rules-team-strategy.log

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const raw = fs.readFileSync("/tmp/full-rules-team-strategy.log", "utf8");
          const lines = raw.trim().split(/\n+/);
          const parsed = lines.map((line) => {
            try { return JSON.parse(line); } catch { return null; }
          }).filter(Boolean);

          const final = [...parsed].reverse().find((value) => value?.strategyQa || value?.qaReport);
          if (!final) {
            throw new Error("ASSOCIATION QA FAIL: strategy QA telemetry/report missing");
          }

          const q = final.strategyQa ?? final.qaReport;
          const fail = (message) => { throw new Error(`ASSOCIATION QA FAIL: ${message}`); };

          if (q.qaStandard !== "guandan-association-full-rules-team-strategy-v3") fail(`wrong qaStandard: ${q.qaStandard}`);
          if (q.ruleProfile !== "national-competitive") fail(`wrong/implicit ruleProfile: ${q.ruleProfile}`);
          if (Number(q.playerCount) !== 4) fail(`association mode must be exactly 4 players, got ${q.playerCount}`);
          if (Number(q.deckSize) !== 108) fail(`association mode must use exactly 108 cards, got ${q.deckSize}`);
          if (!Array.isArray(q.cardsPerPlayer) ? Number(q.cardsPerPlayer) !== 27 : q.cardsPerPlayer.some((n) => Number(n) !== 27)) fail("each of four players must hold 27 cards after deal");
          if (q.deadlocks || q.stateErrors || q.crashes) fail(`integrity failures: ${JSON.stringify({deadlocks:q.deadlocks,stateErrors:q.stateErrors,crashes:q.crashes})}`);
          if (!q.completedThroughA) fail("no team completed the formal 2 -> A -> pass-A victory path");
          if (!q.winnerTeam) fail("winnerTeam missing");
          if (q.hiddenInformationIsolation !== true) fail("bot can access hidden teammate/opponent/future-deck information");
          if (q.illegalSignallingProtection !== true) fail("illegal signalling / side-channel protection missing");
          if (q.associationCompliance !== true) fail("associationCompliance not proven");

          const requiredTypes = [
            "single","pair","triple","fullHouse","straight",
            "consecutivePairs","consecutiveTriples","straightFlush",
            "bomb4","bomb5","bomb6Plus","jokerBomb","heartLevelWildcardPlay"
          ];
          const coverage = q.playTypeCoverage ?? {};
          for (const type of requiredTypes) {
            if (!(Number(coverage[type]) > 0)) fail(`required real play type not observed: ${type}`);
          }

          const deterministic = q.deterministicRuleCoverage ?? {};
          const requiredRules = [
            "fourPlayerTwoTeamsOppositePartners","twoDeck108Cards","twentySevenCardsEach",
            "levelRankOrdering","levelRankNaturalSequenceBehavior",
            "heartLevelWildcardSingleBehavior","heartLevelWildcardPair","heartLevelWildcardTriple",
            "heartLevelWildcardFullHouse","heartLevelWildcardStraight","heartLevelWildcardConsecutivePairs",
            "heartLevelWildcardConsecutiveTriples","heartLevelWildcardStraightFlush","heartLevelWildcardBomb",
            "heartLevelWildcardDoubleUse","heartLevelWildcardCannotRepresentJoker",
            "heartLevelWildcardDeterministicInterpretation","straightAceLow","straightAceHigh",
            "rejectKingAceTwoWrap","bomb4Hierarchy","bomb5Hierarchy","bomb6Hierarchy",
            "bomb7Hierarchy","bomb8Hierarchy","straightFlushBombHierarchy","jokerBombHighest",
            "sameTypeSameSizeComparison","fullHouseTripleControlsComparison","passAndLeadReset",
            "finishOrderAndAutoLastPlace","partnerCatchLead","singleTribute","doubleTribute",
            "returnTribute","antiTribute","heartLevelExcludedFromMandatoryTribute",
            "cardConservationAcrossTribute","promotionByPlacements","levelKToA","passAEndCondition",
            "illegalPlayStateAtomicity","allRequiredRulesPassed"
          ];
          for (const rule of requiredRules) {
            if (deterministic[rule] !== true) fail(`deterministic rule missing/failed: ${rule}`);
          }

          const tactics = q.expertTacticalCoverage ?? {};
          const requiredTactics = [
            "handStructureAssessment","roleSelectionFromLegalInformation","dynamicRoleSwitch",
            "leadSmallBurdenWithoutBreakingStructure","partnerFeeding","partnerYielding",
            "minimumSufficientOvertake","opponentSprintBlock","bombConservation","bombForControlWithFollowup",
            "wildcardValueOptimization","playedCardMemory","remainingCardInferenceWithoutHiddenInfo",
            "endgameModeSwitch","partnerCatchLeadExploitation","upgradeOutcomeOptimization",
            "tributeReturnStrategy"
          ];
          for (const tactic of requiredTactics) {
            if (tactics[tactic]?.passed !== true && tactics[tactic] !== true) fail(`expert tactic missing/failed: ${tactic}`);
          }

          if (!Array.isArray(q.teams) || q.teams.length !== 2) fail("standard table must report exactly two teams");
          for (const team of q.teams) {
            if (!team.teamName) fail("teamName missing");
            if (!Array.isArray(team.players) || team.players.length !== 2) fail(`${team.teamName}: standard team must contain exactly 2 players`);
            if (!Array.isArray(team.rounds) || team.rounds.length < 1) fail(`${team.teamName}: round analysis missing`);

            let coordinationEvents = 0;
            for (const round of team.rounds) {
              if (!round.levelBefore || !round.levelAfter) fail(`${team.teamName}: level progression missing in round ${round.round}`);
              if (!round.roleAssessment) fail(`${team.teamName}: legal-information role assessment missing in round ${round.round}`);
              if (!Array.isArray(round.coordinationMethods)) fail(`${team.teamName}: coordinationMethods missing in round ${round.round}`);
              if (!Array.isArray(round.keyCoordinationEvents)) fail(`${team.teamName}: keyCoordinationEvents missing in round ${round.round}`);
              coordinationEvents += round.keyCoordinationEvents.length;
              if (!round.winReason && round.wonOrAdvanced) fail(`${team.teamName}: win/advance reason missing in round ${round.round}`);
            }
            if (coordinationEvents < 1) fail(`${team.teamName}: no real teammate-coordination event was recorded`);
          }

          if (q.humanStyleChecks?.passed !== true) fail("human-style natural play checks did not pass");
          if (q.teamStrategyChecks?.passed !== true) fail("teammate-support strategy checks did not pass");
          if (q.heartLevelWildcardChecks?.passed !== true) fail("heart-level wildcard / 逢人配 checks did not pass");
          if (q.tributeChecks?.passed !== true) fail("tribute/return/anti-tribute checks did not pass");
          if (q.cardConservationChecks?.passed !== true) fail("108-card conservation checks did not pass");
          if (q.expertTacticalChecks?.passed !== true) fail("expert tactical suite did not pass");

          fs.writeFileSync("/tmp/guandan-team-strategy-report.json", JSON.stringify(q, null, 2));
          const md = q.markdownReport;
          if (typeof md !== "string" || !md.trim()) fail("human-readable Markdown team analysis report missing");
          fs.writeFileSync("/tmp/guandan-team-strategy-report.md", md);

          console.log(JSON.stringify({
            type: "guandan_association_standard_full_rules_team_strategy_pass",
            qaStandard: q.qaStandard,
            ruleProfile: q.ruleProfile,
            associationCompliance: q.associationCompliance,
            winnerTeam: q.winnerTeam,
            completedThroughA: q.completedThroughA,
            teams: q.teams.map((t) => ({teamName:t.teamName, players:t.players, rounds:t.rounds.length})),
            playTypeCoverage: coverage,
            deterministicRuleCoverage: deterministic,
            expertTacticalCoverage: tactics
          }));
          NODE

      - name: Frontend acceptance - current level and final winner ranking
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm test -- --runInBand GuandanRoundResultHud.test.tsx

      - name: Publish association-standard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guandan-association-full-rules-team-strategy-report
          if-no-files-found: ignore
          path: |
            /tmp/guandan-team-strategy-report.json
            /tmp/guandan-team-strategy-report.md

# QA standards:
# - yihua-game/QA_GUANDAN_FULL_RULES_TEAM_STRATEGY.md
# - yihua-game/QA_GUANDAN_ASSOCIATION_COMPLIANCE.md
