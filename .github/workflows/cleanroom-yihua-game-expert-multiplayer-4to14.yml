name: Yihua Game Expert Bot 4-14 Player Matrix

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - ".github/workflows/cleanroom-yihua-game-expert-multiplayer-4to14.yml"
      - "yihua-game/scripts/**"
      - "yihua-game/src/core/**"
      - "yihua-game/test/**"
  workflow_dispatch:

jobs:
  expert-bot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: yihua-game
    strategy:
      fail-fast: false
      matrix:
        player_count: [4, 6, 8, 10, 12, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build standalone server
        run: npm run build
      - name: Expert bot soak - ${{ matrix.player_count }} players
        env:
          SOAK_DURATION_MS: "180000"
          SOAK_PLAYER_COUNTS: "${{ matrix.player_count }}"
          SOAK_RECONNECT_EVERY: "350"
          SOAK_ACTION_LIMIT: "300000"
          QA_REQUIRE_TEAM_STRATEGY: "1"
          QA_REQUIRE_FULL_RULE_COVERAGE: "1"
          QA_REQUIRE_HEART_LEVEL_WILDCARD: "1"
          QA_REQUIRE_CARD_CONSERVATION: "1"
          QA_REQUIRE_HIDDEN_INFO_ISOLATION: "1"
          QA_REQUIRE_ILLEGAL_SIGNALLING_PROTECTION: "1"
          QA_REQUIRE_EXPERT_TACTICS: "1"
          QA_REPORT_JSON: "/tmp/expert-${{ matrix.player_count }}.json"
          QA_REPORT_MD: "/tmp/expert-${{ matrix.player_count }}.md"
        run: |
          set -euo pipefail
          node scripts/soak-websocket.mjs | tee /tmp/expert-${{ matrix.player_count }}.log
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pc = Number(process.env.SOAK_PLAYER_COUNTS);
          const raw = fs.readFileSync(`/tmp/expert-${pc}.log`, "utf8");
          const parsed = raw.trim().split(/\n+/).map(line => { try { return JSON.parse(line); } catch { return null; } }).filter(Boolean);
          const final = [...parsed].reverse().find(v => v?.strategyQa || v?.qaReport || v?.summary || v?.playerCount || v?.metrics || Array.isArray(v?.tables));
          if (!final) throw new Error(`EXPERT MATRIX FAIL ${pc}: no terminal telemetry`);
          const table = Array.isArray(final.tables) ? final.tables.find(v => Number(v?.playerCount) === pc) : null;
          const q = final.strategyQa ?? final.qaReport ?? table ?? final;
          const failures = [];
          const fail = (m) => failures.push(m);
          const rounds = Number(table?.rounds ?? final?.metrics?.rounds ?? q?.metrics?.rounds ?? q?.rounds ?? 0);
          if (rounds < 3) fail(`only ${rounds} complete rounds; require >=3`);
          if (Number(q.playerCount ?? table?.playerCount ?? final?.metrics?.playerCount ?? pc) !== pc) fail(`wrong player count: ${q.playerCount ?? table?.playerCount ?? final?.metrics?.playerCount}`);
          if (q.deadlocks ?? table?.deadlocks ?? final?.metrics?.deadlocks) fail(`deadlocks=${q.deadlocks ?? table?.deadlocks ?? final?.metrics?.deadlocks}`);
          if (q.stateErrors ?? table?.stateErrors ?? final?.metrics?.stateErrors) fail(`stateErrors=${q.stateErrors ?? table?.stateErrors ?? final?.metrics?.stateErrors}`);
          if (q.crashes ?? table?.crashes ?? final?.metrics?.crashes) fail(`crashes=${q.crashes ?? table?.crashes ?? final?.metrics?.crashes}`);
          if (q.hiddenInformationIsolation === false) fail("hidden information isolation failed");
          if (q.illegalSignallingProtection === false) fail("illegal signalling protection failed");
          const coverage = q.playTypeCoverage ?? final?.playTypeCoverage ?? {};
          for (const type of ["single","pair","triple","fullHouse","straight","consecutivePairs","consecutiveTriples","straightFlush","bomb4","bomb5","bomb6Plus","jokerBomb","heartLevelWildcardPlay"]) {
            if (!(Number(coverage[type]) > 0)) fail(`missing play type ${type}`);
          }
          const tactics = q.expertTacticalCoverage ?? final?.expertTacticalCoverage ?? final?.tacticCoverage ?? {};
          for (const tactic of ["handStructureAssessment","roleSelectionFromLegalInformation","dynamicRoleSwitch","partnerFeeding","partnerYielding","minimumSufficientOvertake","opponentSprintBlock","bombConservation","wildcardValueOptimization","playedCardMemory","remainingCardInferenceWithoutHiddenInfo","endgameModeSwitch"]) {
            const v = tactics[tactic];
            if (v?.passed !== true && v !== true && !(Number(v) > 0)) fail(`missing tactic ${tactic}`);
          }
          if (failures.length) {
            console.error(`EXPERT MATRIX ROOT CAUSES ${pc}:`);
            for (const f of failures) console.error(` - ${f}`);
            process.exit(1);
          }
          console.log(JSON.stringify({type:"expert_bot_matrix_pass",playerCount:pc,completedRounds:rounds,coverage,tactics}));
          NODE
      - name: Publish ${{ matrix.player_count }} player report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-bot-${{ matrix.player_count }}-player-report
          if-no-files-found: ignore
          path: |
            /tmp/expert-${{ matrix.player_count }}.json
            /tmp/expert-${{ matrix.player_count }}.md
            /tmp/expert-${{ matrix.player_count }}.log
