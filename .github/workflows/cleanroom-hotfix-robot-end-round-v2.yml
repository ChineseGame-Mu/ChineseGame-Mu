name: Cleanroom robot end-round hotfix v2

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
    paths:
      - .github/workflows/cleanroom-hotfix-robot-end-round-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Patch EndRound robot continuation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/guandan_handler.rs')
          s = p.read_text()
          marker = 'GuandanClientMessage::EndRound => {'
          i = s.find(marker)
          if i < 0:
              raise SystemExit('EndRound anchor not found')
          tail = s[i:]
          old = '''                let key = match joined_room.clone() {
                    Some(key) => key,
                    None => continue,
                };
                let result = storage
'''
          new = '''                let key = match joined_room.clone() {
                    Some(key) => key,
                    None => continue,
                };
                let hook_to_bottom = hook_to_bottom_for(&key);
                let result = storage
'''
          if old not in tail:
              raise SystemExit('key/result anchor not found')
          tail = tail.replace(old, new, 1)
          old2 = '''                        state.game.passes = 0;
                        state.game.trick_complete = false;
                        state.bump_version();
'''
          new2 = '''                        state.game.passes = 0;
                        state.game.trick_complete = false;
                        run_robot_turns(&mut state.game, hook_to_bottom).map_err(|_| ())?;
                        state.bump_version();
'''
          if old2 not in tail:
              raise SystemExit('reset anchor not found')
          tail = tail.replace(old2, new2, 1)
          p.write_text(s[:i] + tail)
          PY
      - name: Verify
        run: |
          grep -A40 'GuandanClientMessage::EndRound' backend/src/guandan_handler.rs | grep 'run_robot_turns'
          cargo check -p backend
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/guandan_handler.rs
          git commit -m 'fix(cleanroom): let robot lead after trick collection'
          git push origin HEAD:cleanroom/yihua-game-20260826
