name: Cleanroom Lobby Visual Gate

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
  workflow_dispatch:

jobs:
  lobby-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONTEND_URL: https://yihua-mu.vercel.app
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mandatory final-art lobby visual geometry
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          let actualCommit = null;
          for (let attempt = 1; attempt <= 24; attempt++) {
            const response = await page.goto(process.env.FRONTEND_URL, {waitUntil:'networkidle', timeout:60000});
            if (!response || !response.ok()) throw new Error(`frontend HTTP ${response?.status()}`);
            actualCommit = await page.locator('html').getAttribute('data-cleanroom-commit');
            if (actualCommit === process.env.EXPECTED_COMMIT) break;
            if (attempt < 24) await page.waitForTimeout(10000);
          }
          if (actualCommit !== process.env.EXPECTED_COMMIT) throw new Error(`stale fixed link: ${actualCommit}`);

          const required = {
            shell: '.cleanroom-final-shell',
            stage: '.cleanroom-final-stage',
            art: '.cleanroom-final-art',
            form: '.cleanroom-final-form',
            room: '#cleanroom-room',
            players: '#cleanroom-player-count',
            name: '#cleanroom-player-name',
            enter: '#cleanroom-enter-room',
          };
          for (const [name, sel] of Object.entries(required)) {
            const loc = page.locator(sel);
            if (await loc.count() !== 1) throw new Error(`${name} must exist exactly once`);
            if (!(await loc.isVisible())) throw new Error(`${name} must be visible`);
          }

          const art = page.locator(required.art);
          const src = await art.getAttribute('src');
          if (!src?.startsWith('data:image/webp;base64,')) throw new Error('approved artwork data URI missing');
          const imageInfo = await art.evaluate((img) => ({naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, complete: img.complete}));
          if (!imageInfo.complete || imageInfo.naturalWidth < 600 || imageInfo.naturalHeight < 500) throw new Error(`artwork failed to decode or is not high resolution enough: ${JSON.stringify(imageInfo)}`);

          const roomOptions = await page.locator('#cleanroom-room option').allTextContents();
          if (JSON.stringify(roomOptions) !== JSON.stringify(['0001','0002','0003','0004'])) throw new Error(`wrong room options: ${JSON.stringify(roomOptions)}`);
          const playerOptions = await page.locator('#cleanroom-player-count option').allTextContents();
          if (playerOptions.length !== 6) throw new Error(`wrong player option count: ${playerOptions.length}`);
          if (await page.locator('#cleanroom-room').inputValue() !== '0004') throw new Error('default room must be 0004');

          const box = async sel => {
            const b = await page.locator(sel).boundingBox();
            if (!b) throw new Error(`missing box for ${sel}`);
            return {top:b.y,bottom:b.y+b.height,left:b.x,right:b.x+b.width,width:b.width,height:b.height};
          };
          const stage = await box(required.stage);
          const room = await box(required.room);
          const players = await box(required.players);
          const name = await box(required.name);
          const enter = await box(required.enter);

          await page.screenshot({path:'lobby-iphone-390x844.png', fullPage:true});

          for (const [label,b] of Object.entries({room,players,name,enter})) {
            if (b.left < 0 || b.right > 390 || b.top < 0 || b.bottom > 844) throw new Error(`${label} outside viewport: ${JSON.stringify(b)}`);
            if (b.width < 130 || b.height < 10) throw new Error(`${label} too small: ${JSON.stringify(b)}`);
          }
          if (!(room.bottom < players.top && players.bottom < name.top && name.bottom < enter.top)) throw new Error('live controls overlap or are out of order');
          const center = b => b.left + b.width / 2;
          for (const [label,b] of Object.entries({room,players,name,enter})) {
            if (Math.abs(center(b) - 195) > 8) throw new Error(`${label} not horizontally centered: ${JSON.stringify(b)}`);
          }
          if (Math.abs(room.width - players.width) > 4 || Math.abs(room.width - name.width) > 4 || Math.abs(room.width - enter.width) > 4) throw new Error('overlay widths do not align');
          const expectedStageHeight = 390 * 1167 / 1348;
          if (Math.abs(stage.width - 390) > 2 || Math.abs(stage.height - expectedStageHeight) > 3) throw new Error(`stage must preserve the complete approved 1348x1167 artwork without side cropping: ${JSON.stringify(stage)}`);

          console.log(JSON.stringify({type:'lobby_visual_gate_pass',viewport:{width:390,height:844},actualCommit,imageInfo,stage,room,players,name,enter}));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lobby-iphone-390x844
          path: lobby-iphone-390x844.png
          if-no-files-found: ignore
