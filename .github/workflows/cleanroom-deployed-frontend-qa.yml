name: Cleanroom Deployed Frontend QA

on:
  push:
    branches:
      - cleanroom/yihua-game-20260826
  workflow_dispatch:

jobs:
  deployed-frontend-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend build and focused acceptance
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm test -- --runInBand GuandanWebsocketProvider.test.tsx GuandanRoundResultHud.test.tsx
          npm run build

      - name: Source must contain deployment-scoped room isolation
        working-directory: frontend
        run: |
          set -euo pipefail
          grep -q "cleanroomDeploymentRoom" src/GuandanWebsocketProvider.tsx
          grep -q 'return `cr-' src/GuandanWebsocketProvider.tsx
          grep -q 'endsWith(".vercel.app")' src/GuandanWebsocketProvider.tsx

      - name: Built bundle must contain current Cleanroom runtime markers
        working-directory: frontend
        run: |
          set -euo pipefail
          for marker in "ENTER ROOM" "cleanroom-join-shell" "cleanroomRoom" "card-games-yihua.onrender.com/api/guandan" ".vercel.app" "cr-"; do
            if ! grep -R -q -- "$marker" dist; then
              echo "Missing built runtime marker: $marker" >&2
              exit 1
            fi
          done

      - name: Latest branch deployment must serve current Cleanroom bundle
        working-directory: frontend
        env:
          CLEANROOM_DEPLOYMENT_URL: "https://yihua-mu-git-cleanroom-yihua-game-20260826-chinese-game.vercel.app/"
          CLEANROOM_DEPLOYMENT_RETRIES: "30"
          CLEANROOM_DEPLOYMENT_DELAY_MS: "10000"
        run: node scripts/verify-cleanroom-deployment.mjs

# This gate runs on every push to the Cleanroom branch so a backend/rule-only commit
# cannot produce a new READY Vercel deployment without frontend acceptance evidence.
# Runtime markers are ASCII literals deliberately chosen to survive production minification
# and Unicode escaping; Chinese UI text is covered by focused React tests instead.
# It prevents two recurring failures:
# 1) giving a READY Vercel URL that still serves an older/incorrect frontend bundle;
# 2) reusing the same backend room namespace across immutable deployments, which can expose stale room occupants/state.
