name: Fix cleanroom robot candidate priority

on:
  push:
    paths:
      - '.github/workflows/fix-cleanroom-robot-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanroom/yihua-game-20260826
      - name: Patch robot candidate ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('yihua-game/src/core/legacy-guandan-gateway.ts')
          s = p.read_text()
          if 'classifyGameCardIds' not in s:
              anchor = 'import type { ServerMessage } from "./protocol.js";\n'
              s = s.replace(anchor, 'import { RANKS, type Rank } from "./cards.js";\nimport { classifyGameCardIds } from "./game-actions.js";\n' + anchor)
          helper_anchor = 'const clearRobotWonTrick = async (\n'
          if 'const robotCandidatePriority = (' not in s:
              helper = '''const robotNormalStrength = (\n  hand: ReturnType<typeof classifyGameCardIds>,\n  levelRank: Rank,\n): number => {\n  if (hand.jokerSize !== undefined) {\n    return RANKS.length + 2 + (hand.jokerSize === "big" ? 1 : 0);\n  }\n  const rank = hand.rank ?? hand.highRank;\n  if (rank === undefined) return 0;\n  if (rank === levelRank && hand.highRank === undefined) return RANKS.length + 1;\n  return RANKS.indexOf(rank);\n};\n\nconst robotCandidatePriority = (\n  game: Extract<ReturnType<ServerRuntime["rooms"]["get"]>["game"], { phase: "playing" }>,\n  seat: number,\n  cardIds: readonly string[],\n): number => {\n  const hand = classifyGameCardIds(game, seat, cardIds, game.levelRank);\n  const strength = robotNormalStrength(hand, game.levelRank ?? "2");\n  switch (hand.kind) {\n    case "single":\n      return 0 + strength;\n    case "pair":\n      return 100 + strength;\n    case "triple":\n      return 200 + strength;\n    case "full-house":\n      return 300 + strength;\n    case "straight":\n      return 400 + strength;\n    case "consecutive-pairs":\n      return 500 + strength;\n    case "consecutive-triples":\n      return 600 + strength;\n    case "bomb":\n      if (hand.size >= 6) return 8000 + hand.size * 100 + strength;\n      if (hand.size == 5) return 6000 + strength;\n      return 5000 + strength;\n    case "straight-flush":\n      return 7000 + strength;\n    case "joker-bomb":\n      return 10000;\n    case "invalid":\n      return 20000;\n  }\n};\n\n'''
              s = s.replace(helper_anchor, helper + helper_anchor)
          old = '    for (const cardIds of robotCandidateCardIds(hand)) {\n'
          new = '''    const candidates = robotCandidateCardIds(hand).sort(\n      (left, right) =>\n        robotCandidatePriority(managed.game, seat, left) -\n        robotCandidatePriority(managed.game, seat, right),\n    );\n    for (const cardIds of candidates) {\n'''
          if old not in s:
              raise SystemExit('robot candidate loop anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add yihua-game/src/core/legacy-guandan-gateway.ts
          git commit -m "fix(cleanroom): sort robot plays by Guandan strength" || exit 0
          git push origin HEAD:cleanroom/yihua-game-20260826
